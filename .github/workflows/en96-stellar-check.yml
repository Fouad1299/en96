
name: EN96 Stellar Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stellar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PGHOST: aws-0-eu-west-1.pooler.supabase.com
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: en96_bridge_writer.zfoanswefwufsifncrhl
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /tmp/supabase-ca.crt
      PGPASSWORD: ${{ secrets.EN96_BRIDGE_DB_PASSWORD }}
      EN96_RECORD_DEPOSITS: "0"
      EN96_ENABLE_BNB_MINT: "0"

    steps:
      - name: Checkout EN96 repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PostgreSQL tools
        run: |
          python -m pip install "psycopg[binary]>=3.2,<4"
          sudo apt-get update
          sudo apt-get install -y postgresql-client ca-certificates
          python -c "import psycopg; print('PASS: psycopg installed')"

      - name: Prepare trusted Supabase CA
        env:
          SUPABASE_CA: ${{ secrets.EN96_SUPABASE_CA_CERT }}
        run: |
          if [ -z "$SUPABASE_CA" ]; then
            echo "::error::Missing Supabase CA certificate"
            exit 1
          fi

          if [ -z "$PGPASSWORD" ]; then
            echo "::error::Missing database password"
            exit 1
          fi

          printf '%s\n' "$SUPABASE_CA" > "$PGSSLROOTCERT"
          chmod 600 "$PGSSLROOTCERT"

          openssl x509 \
            -in "$PGSSLROOTCERT" \
            -noout

          echo "PASS: Supabase CA prepared"

      - name: Verify database connection
        run: |
          psql -X -v ON_ERROR_STOP=1 \
            -c "SELECT current_user, current_database();"

      - name: Verify database role and permissions
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(
              host=os.environ["PGHOST"],
              port=os.environ["PGPORT"],
              dbname=os.environ["PGDATABASE"],
              user=os.environ["PGUSER"],
              password=os.environ["PGPASSWORD"],
              sslmode="verify-full",
              sslrootcert=os.environ["PGSSLROOTCERT"],
              connect_timeout=15,
          ) as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT current_user")
                  role = cur.fetchone()[0]

                  if role != "en96_bridge_writer":
                      raise RuntimeError(
                          "Unexpected database role"
                      )

                  cur.execute("""
                      SELECT
                          COUNT(*),
                          COUNT(*) FILTER (
                              WHERE status = 'observed'
                          )
                      FROM public.en96_bridge_deposits
                  """)
                  total, observed = cur.fetchone()

                  print("PASS: Correct database role")
                  print("Visible deposits:", total)
                  print("Observed deposits:", observed)

                  cur.execute("""
                      SELECT COUNT(*)
                      FROM public.en96_bridge_checkpoints
                      WHERE watcher_name = 'stellar_escrow_v1'
                  """)
                  checkpoints = cur.fetchone()[0]

                  print("PASS: Checkpoint table readable")
                  print("Stored checkpoints:", checkpoints)

                  cur.execute("""
                      SELECT
                          has_table_privilege(
                              current_user,
                              'public.en96_bridge_deposits',
                              'UPDATE'
                          ),
                          has_table_privilege(
                              current_user,
                              'public.en96_bridge_deposits',
                              'DELETE'
                          ),
                          has_table_privilege(
                              current_user,
                              'public.en96_bridge_checkpoints',
                              'UPDATE'
                          ),
                          has_table_privilege(
                              current_user,
                              'public.en96_bridge_checkpoints',
                              'DELETE'
                          )
                  """)

                  permissions = cur.fetchone()

                  if any(permissions):
                      raise RuntimeError(
                          "Unexpected UPDATE or DELETE permission"
                      )

                  print("PASS: No UPDATE or DELETE grants")

          print("PASS: Database access checks completed")
          PY

      - name: Test deposit insert and duplicate protection
        run: |
          python - <<'PY'
          import os
          import uuid
          import psycopg

          test_id = uuid.uuid4().hex
          tx_hash = "en96_rollback_" + test_id
          operation_id = "en96_operation_" + test_id

          escrow = (
              "GCLZAUUMJHXSEGO5KQEIX5IMEVW3766CRG5TFR4PPUKTR5JUYXJDFM4O"
          )
          issuer = (
              "GCUGIICUGBFC3KBPIFYAMPNA7OVJHGY277TNYTZUSG7EVVUCVACH3OGB"
          )

          sql = """
              INSERT INTO public.en96_bridge_deposits (
                  stellar_tx_hash,
                  operation_index,
                  stellar_operation_id,
                  source_account,
                  escrow_account,
                  asset_code,
                  asset_issuer,
                  amount,
                  status
              )
              VALUES (
                  %s, %s, %s, %s, %s,
                  'EN96', %s, %s, 'observed'
              )
              ON CONFLICT (
                  stellar_tx_hash,
                  operation_index
              )
              DO NOTHING
              RETURNING id
          """

          conn = psycopg.connect(
              host=os.environ["PGHOST"],
              port=os.environ["PGPORT"],
              dbname=os.environ["PGDATABASE"],
              user=os.environ["PGUSER"],
              password=os.environ["PGPASSWORD"],
              sslmode="verify-full",
              sslrootcert=os.environ["PGSSLROOTCERT"],
              connect_timeout=15,
              autocommit=False,
          )

          try:
              with conn.cursor() as cur:
                  cur.execute(
                      "SELECT COUNT(*) FROM public.en96_bridge_deposits"
                  )
                  before_count = cur.fetchone()[0]

                  values = (
                      tx_hash,
                      0,
                      operation_id,
                      escrow,
                      escrow,
                      issuer,
                      "0.0000001",
                  )

                  cur.execute(sql, values)

                  if cur.fetchone() is None:
                      raise RuntimeError(
                          "Initial test insert failed"
                      )

                  print("PASS: Test deposit inserted")

                  cur.execute(sql, values)

                  if cur.fetchone() is not None:
                      raise RuntimeError(
                          "Duplicate transaction accepted"
                      )

                  print("PASS: Duplicate transaction rejected")

                  cur.execute(
                      "SAVEPOINT duplicate_operation_test"
                  )

                  alternate = (
                      "en96_alternate_" + test_id,
                      1,
                      operation_id,
                      escrow,
                      escrow,
                      issuer,
                      "0.0000001",
                  )

                  try:
                      cur.execute(sql, alternate)

                  except psycopg.errors.UniqueViolation as error:
                      if error.diag.constraint_name != (
                          "en96_bridge_unique_stellar_id"
                      ):
                          raise

                      cur.execute(
                          "ROLLBACK TO SAVEPOINT duplicate_operation_test"
                      )

                      print(
                          "PASS: Duplicate operation ID rejected"
                      )

                  else:
                      raise RuntimeError(
                          "Duplicate operation ID accepted"
                      )

                  cur.execute(
                      "RELEASE SAVEPOINT duplicate_operation_test"
                  )

              conn.rollback()

              print("PASS: Test transaction rolled back")

              with conn.cursor() as cur:
                  cur.execute(
                      """
                      SELECT COUNT(*)
                      FROM public.en96_bridge_deposits
                      WHERE stellar_tx_hash = %s
                         OR stellar_operation_id = %s
                      """,
                      (tx_hash, operation_id),
                  )

                  if cur.fetchone()[0] != 0:
                      raise RuntimeError(
                          "Test deposit remains"
                      )

                  cur.execute(
                      "SELECT COUNT(*) FROM public.en96_bridge_deposits"
                  )

                  if cur.fetchone()[0] != before_count:
                      raise RuntimeError(
                          "Deposit count changed"
                      )

              print("PASS: No permanent test deposits")

          finally:
              conn.rollback()
              conn.close()
          PY

      - name: Test checkpoint insert with rollback
        run: |
          python - <<'PY'
          import os
          import psycopg

          conn = psycopg.connect(
              host=os.environ["PGHOST"],
              port=os.environ["PGPORT"],
              dbname=os.environ["PGDATABASE"],
              user=os.environ["PGUSER"],
              password=os.environ["PGPASSWORD"],
              sslmode="verify-full",
              sslrootcert=os.environ["PGSSLROOTCERT"],
              connect_timeout=15,
              autocommit=False,
          )

          try:
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT COUNT(*)
                      FROM public.en96_bridge_checkpoints
                      WHERE watcher_name = 'stellar_escrow_v1'
                  """)
                  before = cur.fetchone()[0]

                  cur.execute("""
                      INSERT INTO public.en96_bridge_checkpoints (
                          watcher_name,
                          paging_token
                      )
                      VALUES (%s, %s)
                      ON CONFLICT (
                          watcher_name,
                          paging_token
                      )
                      DO NOTHING
                      RETURNING id
                  """, (
                      "stellar_escrow_v1",
                      "999999999999999999999999999999999999999",
                  ))

                  if cur.fetchone() is None:
                      raise RuntimeError(
                          "Checkpoint test insert failed"
                      )

                  print("PASS: Checkpoint insert permitted")

              conn.rollback()

              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT COUNT(*)
                      FROM public.en96_bridge_checkpoints
                      WHERE watcher_name = 'stellar_escrow_v1'
                  """)
                  after = cur.fetchone()[0]

                  if after != before:
                      raise RuntimeError(
                          "Checkpoint rollback failed"
                      )

              print("PASS: Checkpoint test rolled back")

          finally:
              conn.rollback()
              conn.close()
          PY

      - name: Run EN96 Stellar watcher version 0.7
        run: |
          python stellar_bridge_watcher.py

      - name: Confirm bridge remains disabled
        run: |
          echo "PASS: EN96 watcher verification completed"
          echo "Database checkpoint testing enabled"
          echo "Deposit recording remains disabled"
          echo "No Stellar transfers performed"
          echo "No BNB minting performed"
          echo "Bridge remains disabled"


name: EN96 Stellar Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stellar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout EN96 repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify EN96 on Stellar Mainnet
        run: python stellar_bridge_watcher.py

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client ca-certificates

      - name: Test EN96 bridge database connection
        env:
          PGPASSWORD: ${{ secrets.EN96_BRIDGE_DB_PASSWORD }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt
        run: |
          psql \
            "host=aws-0-eu-west-1.pooler.supabase.com port=5432 dbname=postgres user=en96_bridge_writer.zfoanswefwufsifncrhl connect_timeout=10" \
            -X -v ON_ERROR_STOP=1 \
            -c "SELECT current_user, current_database();"

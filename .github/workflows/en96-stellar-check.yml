
name: EN96 Stellar Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stellar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout EN96 repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify EN96 on Stellar Mainnet
        run: python stellar_bridge_watcher.py
